name: bm
description: BM Building Materials Marketplace
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.3.4
  firebase_core: ^3.8.1
  cloud_firestore: ^5.6.12
  cloud_functions: ^5.6.2
  firebase_messaging: ^15.2.10
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  firebase_storage: ^12.4.10
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/onboarding/
    - assets/images/categories/
    - assets/images/products/
    - assets/images/banners/
    - assets/images/placeholders/
    - assets/animations/
    - assets/icons/
